<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <section id="login">
        <h1>
            Welcome
        </h1>
        <h2>
            Secure access to the Employee Dashboard
        </h2>
        <div class="login-card">
            <label for="">
                EMAIL
            </label>
            <br>
            <input type="text" class="login-input" placeholder="email@example.com">
            <br>
            <label for="">
                PASSWORD
            </label>
            <p>
                Password must be at least 8 characters long and contain 1 number
            </p>
            <input type="text" class="login-input" placeholder="Input your password">
            <br>
            <input type="checkbox" name="Remember me" id="login-remember">
                Remember me
            </input>
            <br>
            <button class="login-btn">
                Log in
            </button>
        </div>
    </section>
</body>
</html>
