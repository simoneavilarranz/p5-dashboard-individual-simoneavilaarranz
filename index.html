<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/src/css/main.css">
    <title>Dashboard</title>
</head>
<body>
    <section id="login">
        
        <h1>Welcome</h1>
        <h2>Secure access to the Employee Dashboard</h2>
        <div class="login-card">
            <label for="login-email">
                EMAIL
            </label>
            <input type="email" id="login-email" class="login-input" placeholder="email@example.com">
            <label for="login-password">
                PASSWORD
            </label>
            <p>
                Password must be at least 8 characters long and contain 1 number
            </p>
            <input type="password" id="login-password" class="login-input" placeholder="Input your password">
            <div class="remember-me">
                <input type="checkbox" name="Remember me" id="login-remember">
                <label for="login-remember">
                    Remember me
                </label>
            </div>
            <div id="error-message"></div>
            <button id="login-btn">Log in</button>
        </div>
    </section>
    <script type="module" src="./src/js/login.js"></script>
</body>
</html>
